document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ter-spacing:-.01em;text-wrap:pretty\">Done ressemble à un carnet tenu à l’encre de nuit : un papier lavande, des violets qui s’intensifient à mesure que le travail avance, et une seule couleur chaude réservée aux vraies alertes. Le temps pris est hachuré, le travail en cours est violet, et tout le reste se tait pour que l’état du système se lise d’un regard.<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:12px\"><div style=\"font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#5E4A78\">Sommaire<\u002Fdiv><nav style=\"display:flex;flex-wrap:wrap;gap:6px\"><a href=\"#palette\" style=\"height:28px;padding:0 12px;border-radius:3px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;background:#FFFFFF;box-shadow:inset 0 0 0 1px #E8DFF2;color:#11002C;text-decoration:none\"><span style=\"font-variant-numeric:tabular-nums;color:#5E4A78\">01<\u002Fspan>Palette<\u002Fa><a href=\"#roles\" style=\"height:28px;padding:0 12px;border-radius:3px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;background:#FFFFFF;box-shadow:inset 0 0 0 1px #E8DFF2;color:#11002C;text-decoration:none\"><span style=\"font-variant-numeric:tabular-nums;color:#5E4A78\">02<\u002Fspan>Tokens couleur<\u002Fa><a href=\"#contrastes\" style=\"height:28px;padding:0 12px;border-radius:3px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;background:#FFFFFF;box-shadow:inset 0 0 0 1px #E8DFF2;color:#11002C;text-decoration:none\"><span style=\"font-variant-numeric:tabular-nums;color:#5E4A78\">03<\u002Fspan>Contrastes<\u002Fa><a href=\"#typo\" style=\"height:28px;padding:0 12px;border-radius:3px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;background:#FFFFFF;box-shadow:inset 0 0 0 1px #E8DFF2;color:#11002C;text-decoration:none\"><span style=\"font-variant-numeric:tabular-nums;color:#5E4A78\">04<\u002Fspan>Typographie<\u002Fa><a href=\"#mesures\" style=\"height:28px;padding:0 12px;border-radius:3px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;background:#FFFFFF;box-shadow:inset 0 0 0 1px #E8DFF2;color:#11002C;text-decoration:none\"><span style=\"font-variant-numeric:tabular-nums;color:#5E4A78\">05<\u002Fspan>Mesures<\u002Fa><a href=\"#composants\" style=\"height:28px;padding:0 12px;border-radius:3px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;background:#FFFFFF;box-shadow:inset 0 0 0 1px #E8DFF2;color:#11002C;text-decoration:none\"><span style=\"font-variant-numeric:tabular-nums;color:#5E4A78\">06<\u002Fspan>Composants<\u002Fa><a href=\"#pomodoro\" style=\"height:28px;padding:0 12px;border-radius:3px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;background:#FFFFFF;box-shadow:inset 0 0 0 1px #E8DFF2;color:#11002C;text-decoration:none\"><span style=\"font-variant-numeric:tabular-nums;color:#5E4A78\">07<\u002Fspan>Pomodoro<\u002Fa><a href=\"#export\" style=\"height:28px;padding:0 12px;border-radius:3px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;background:#FFFFFF;box-shadow:inset 0 0 0 1px #E8DFF2;color:#11002C;text-decoration:none\"><span style=\"font-variant-numeric:tabular-nums;color:#5E4A78\">08<\u002Fspan>Export<\u002Fa><\u002Fnav><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fheader>\n<section id=\"palette\" data-screen-label=\"01 Palette et rôles\" style=\"display:flex;flex-direction:column;gap:28px\">\n<div style=\"display:flex;flex-direction:column;gap:10px;border-top:1px solid #11002C;padding-top:20px\"><div style=\"font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:#5E4A78\">01<\u002Fdiv><h2 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:40px;line-height:44px;font-weight:700;letter-spacing:-.02em\">Palette et rôles<\u002Fh2><p style=\"margin:0;max-width:720px;font-size:15px;line-height:22px;color:#5E4A78;text-wrap:pretty\">Cinq violets, du plus sombre au plus clair, et une teinte d’alerte. Nuit et le papier lavande s’échangent entre clair et sombre ; l’alerte n’apparaît que lorsqu’il faut agir.<\u002Fp><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px\"><div style=\"border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 1px #E8DFF2;display:flex;flex-direction:column;background:#FFFFFF\"><div style=\"height:120px;background:#11002C;color:#FBF7FF;padding:14px;display:flex;flex-direction:column;justify-content:space-between\"><div style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:600\">Nuit<\u002Fdiv><div style=\"font-size:12px;font-weight:500;font-variant-numeric:tabular-nums\">#11002C<\u002Fdiv><\u002Fdiv><div style=\"padding:14px;display:flex;flex-direction:column;gap:10px;font-size:12px;line-height:17px\"><div><div style=\"font-weight:600\">Clair<\u002Fdiv><div style=\"color:#5E4A78\">Texte principal.<\u002Fdiv><\u002Fdiv><div><div style=\"font-weight:600\">Sombre<\u002Fdiv><div style=\"color:#5E4A78\">Fond de fenêtre.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 1px #E8DFF2;display:flex;flex-direction:column;background:#FFFFFF\"><div style=\"height:120px;background:#3B0A6C;color:#FBF7FF;padding:14px;display:flex;flex-direction:column;justify-content:space-between\"><div style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:600\">Aubergine<\u002Fdiv><div style=\"font-size:12px;font-weight:500;font-variant-numeric:tabular-nums\">#3B0A6C<\u002Fdiv><\u002Fdiv><div style=\"padding:14px;display:flex;flex-direction:column;gap:10px;font-size:12px;line-height:17px\"><div><div style=\"font-weight:600\">Clair<\u002Fdiv><div style=\"color:#5E4A78\">Bouton principal, réunion en cours.<\u002Fdiv><\u002Fdiv><div><div style=\"font-weight:600\">Sombre<\u002Fdiv><div style=\"color:#5E4A78\">Surface sélectionnée.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 1px #E8DFF2;display:flex;flex-direction:column;background:#FFFFFF\"><div style=\"height:120px;background:#7B2CBE;color:#FFFFFF;padding:14px;display:flex;flex-direction:column;justify-content:space-between\"><div style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:600\">Violet<\u002Fdiv><div style=\"font-size:12px;font-weight:500;font-variant-numeric:tabular-nums\">#7B2CBE<\u002Fdiv><\u002Fdiv><div style=\"padding:14px;display:flex;flex-direction:column;gap:10px;font-size:12px;line-height:17px\"><div><div style=\"font-weight:600\">Clair<\u002Fdiv><div style=\"color:#5E4A78\">État actif, progression, focus clavier, anneau de concentration.<\u002Fdiv><\u002Fdiv><div><div style=\"font-weight:600\">Sombre<\u002Fdiv><div style=\"color:#5E4A78\">Éclairci en Violet 500 #8A3FD1 pour les pleins.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 1px #E8DFF2;display:flex;flex-direction:column;background:#FFFFFF\"><div style=\"height:120px;background:#C67EFF;color:#11002C;padding:14px;display:flex;flex-direction:column;justify-content:space-between\"><div style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:600\">Lilas<\u002Fdiv><div style=\"font-size:12px;font-weight:500;font-variant-numeric:tabular-nums\">#C67EFF<\u002Fdiv><\u002Fdiv><div style=\"padding:14px;display:flex;flex-direction:column;gap:10px;font-size:12px;line-height:17px\"><div><div style=\"font-weight:600\">Clair<\u002Fdiv><div style=\"color:#5E4A78\">Pleins seulement (jamais en texte).<\u002Fdiv><\u002Fdiv><div><div style=\"font-weight:600\">Sombre<\u002Fdiv><div style=\"color:#5E4A78\">Texte actif, focus clavier, anneau de concentration.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 1px #E8DFF2;display:flex;flex-direction:column;background:#FFFFFF\"><div style=\"height:120px;background:#E0ABFE;color:#11002C;padding:14px;display:flex;flex-direction:column;justify-content:space-between\"><div style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:600\">Lavande<\u002Fdiv><div style=\"font-size:12px;font-weight:500;font-variant-numeric:tabular-nums\">#E0ABFE<\u002Fdiv><\u002Fdiv><div style=\"padding:14px;display:flex;flex-direction:column;gap:10px;font-size:12px;line-height:17px\"><div><div style=\"font-weight:600\">Clair<\u002Fdiv><div style=\"color:#5E4A78\">État « En file », teinte de sélection et de pause.<\u002Fdiv><\u002Fdiv><div><div style=\"font-weight:600\">Sombre<\u002Fdiv><div style=\"color:#5E4A78\">Bouton principal, texte « En file », réunion en cours.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"border-radius:14px;overflow:hidden;box-shadow:inset 0 0 0 1.5px #F0446C;display:flex;flex-direction:column;background:#FFFFFF\"><div style=\"height:120px;background:#F0446C;color:#11002C;padding:14px;display:flex;flex-direction:column;justify-content:space-between\"><div style=\"font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:600\">Alerte (ajoutée)<\u002Fdiv><div style=\"font-size:12px;font-weight:500;font-variant-numeric:tabular-nums\">#F0446C<\u002Fdiv><\u002Fdiv><div style=\"padding:14px;display:flex;flex-direction:column;gap:10px;font-size:12px;line-height:17px\"><div><div style=\"font-weight:600\">Clair<\u002Fdiv><div style=\"color:#5E4A78\">À risque, surcharge uniquement. Contours, icônes, segments.<\u002Fdiv><\u002Fdiv><div><div style=\"font-weight:600\">Sombre<\u002Fdiv><div style=\"color:#5E4A78\">Idem. Déclinée en 700 / 600 et 300 / 400 pour le texte et les pleins.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"font-size:13px;line-height:19px;color:#5E4A78;max-width:760px;text-wrap:pretty\">Les cinq couleurs fournies sont toutes des violets. Une alerte en violet n’aurait aucune force à côté de l’état actif ; j’ai donc ajouté une seule teinte chaude, un rose-rouge de même intensité, réservée à « à risque » et « surcharge ». Les noms Nuit, Aubergine, Violet, Lilas et Lavande sont provisoires.<\u002Fdiv><\u002Fsection>\n<section id=\"roles\" data-screen-label=\"02 Tokens couleur\" style=\"display:flex;flex-direction:column;gap:28px\">\n<div style=\"display:flex;flex-direction:column;gap:10px;border-top:1px solid #11002C;padding-top:20px\"><div style=\"font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:#5E4A78\">02<\u002Fdiv><h2 style=\"margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:40px;line-height:44px;font-weight:700;letter-spacing:-.02em\">Tokens couleur<\u002Fh2><p style=\"margin:0;max-width:720px;font-size:15px;line-height:22px;color:#5E4A78;text-wrap:pretty\">Nommage par rôle, identique dans le JSON, le Swift et le CSS. Le code ne référence jamais une couleur de marque directement.<\u002Fp><\u002Fdiv>\n<div style=\"background:#FFFFFF;border-radius:14px;box-shadow:inset 0 0 0 1px #E8DFF2;overflow:hidden\">\n<div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.6fr);gap:12px;padding:10px 16px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#5E4A78;box-shadow:inset 0 -1px 0 #E8DFF2\"><div>Token<\u002Fdiv><div>Clair<\u002Fdiv><div>Sombre<\u002Fdiv><div>Rôle<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.6fr);gap:12px;padding:7px 16px;align-items:center;font-size:13px;\"><code style=\"font-family:'IBM Plex Sans',sans-serif;font-weight:500;font-size:12px\">bg.canvas<\u002Fcode><div style=\"display:flex;align-items:center;gap:8px;min-width:0\"><span style=\"width:28px;height:28px;border-radius:6px;flex:none;background:#FBF7FF;box-shadow:inset 0 0 0 1px rgba(17,0,44,.14)\"><\u002Fspan><span style=\"font-size:11px;font-variant-numeric:tabular-nums;color:#5E4A78;overflow:hidden;text-overflow:ellipsis\">#FBF7FF<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:center;gap:8px;min-width:0\"><span style=\"width:28px;height:28px;border-radius:6px;flex:none;background:#11002C;box-shadow:inset 0 0 0 1px rgba(17,0,44,.14)\"><\u002Fspan><span style=\"font-size:11px;font-variant-numeric:tabular-nums;color:#5E4A78;overflow:hidden;text-overflow:ellipsis\">#11002C<\u002Fspan><\u002Fdiv><div style=\"font-size:12px;color:#5E4A78\">Fond de fenêtre<\u002Fdiv><\u002Fdiv><div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.6fr);gap:12px;padding:7px 16px;align-items:center;font-size:13px;background:#FCFAFF\"><code style=\"font-family:'IBM Plex Sans',sans-serif;font-weight:500;font-size:12px\">bg.sunken<\u002Fcode><div style=\"display:flex;align-items:center;gap:8px;min-width:0\"><span style=\"width:28px;height:28px;border-radius:6px;flex:none;background:#F2EAFB;box-shadow:inset 0 0 0 1px rgba(17,0,44,.14)\"><\u002Fspan><span style=\"font-size:11px;font-variant-numeric:tabular-nums;color:#5E4A78;overflow:hidden;text-overflow:ellipsis\">#F2EAFB<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:center;gap:8px;min-width:0\"><span style=\"width:28px;height:28px;border-radius:6px;flex:none;background:#0B001F;box-shadow:inset 0 0 0 1px rgba(17,0,44,.14)\"><\u002Fspan><span style=\"font-size:11px;font-variant-numeric:tabular-nums;color:#5E4A78;overflow:hidden;text-overflow:ellipsis\">#0B001F<\u002Fspan><\u002Fdiv><div style=\"font-size:12px;color:#5E4A78\">Barre latérale, pistes, puces neutres<\u002Fdiv><\u002Fdiv><div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.6fr);gap:12px;padding:7px 16px;align-items:center;font-size:13px;\"><code style=\"font-family:'IBM Plex Sans',sans-serif;font-weight:500;font-size:12px\">surface.default<\u002Fcode><div style=\"display:flex;align-items:center;gap:8px;min-width:0\"><span style=\"width:28px;height:28px;border-radius:6px;flex:none;background:#FFFFFF;box-shadow:inset 0 0 0 1px rgba(17,0,44,.14)\"><\u002Fspan><span style=\"font-size:11px;font-variant-numeric:tabular-nums;color:#5E4A78;overflow:hidden;text-overflow:ellipsis\">#FFFFFF<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:center;gap:8px;min-width:0\"><span style=\"width:28px;height:28px;border-radius:6px;flex:none;background:#1C0838;box-shadow:inset 0 0 0 1px rgba(17,0,44,.14)\"><\u002Fspan><span style=\"font-size:11px;font-variant-numeric:tabular-nums;color:#5E4A78;overflow:hidden;text-overflow:ellipsis\">#1C0838<\u002Fspan><\u002Fdiv><div style=\"font-size:12px;color:#5E4A78\">Cartes, lignes, champs<\u002Fdiv><\u002Fdiv><div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.6fr);gap:12px;padding:7px 16px;align-items:center;font-size:13px;background:#FCFAFF\"><code style=\"font-family:'IBM Plex Sans',sans-serif;font-weight:500;font-size:12px\">surface.hover<\u002Fcode><div style=\"display:flex;align-items:center;gap:8px;min-width:0\"><span style=\"width:28px;height:28px;border-radius:6px;flex:none;background:#F6EEFE;box-shadow:inset 0 0 0 1px rgba(17,0,44,.14)\"><\u002Fspan><span style=\"font-size:11px;font-variant-numeric:tabular-nums;color:#5E4A78;overflow:hidden;text-overflow:ellipsis\">#F6EEFE<\u002Fspan><\u002Fdiv><div style=\"display:flex;align-items:center;gap:8px;min-width:0\"><span style=\"width:28px;height:28px;border-radius:6px;flex:none;background:#261047;box-shadow:inset 0 0 0 1px rgba(17,0,44,.14)\"><\u002Fspan><span style=\"font-size:11px;font-variant-numeric:tabular-nums;color:#5E4A78;overflow:hidden;text-overflow:ellipsis\">#261047<\u002Fspan><\u002Fdiv><div style=\"font-size:12px;color:#5E4A78\">Survol<\u002Fdiv><\u002Fdiv><div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.6fr);gap:12px;padding:7px 16px;align-items:center;font-size:13px;\"><code style=\"font-family:'IBM Plex Sans',sans-serif;font-weight:500;font-size:12px\">surface.selected<\u002Fcode>
