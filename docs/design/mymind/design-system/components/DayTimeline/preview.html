<!-- @dsCard group="Ma journée" height=300 -->
<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>DayTimeline</title></head>
<body class="d-preview">
<div class="d-card" style="width:330px">
  <div class="d-widget__head"><span class="d-eyebrow">Ma journée</span><span class="d-widget__link">Calendrier</span></div>
  <div class="d-timeline" style="height:232px">
    <div class="d-timeline__hour" style="top:0"><span>9:00</span></div>
    <div class="d-timeline__hour" style="top:40px"><span>10:00</span></div>
    <div class="d-timeline__hour" style="top:80px"><span>11:00</span></div>
    <div class="d-timeline__hour" style="top:120px"><span>12:00</span></div>
    <div class="d-timeline__hour" style="top:160px"><span>13:00</span></div>
    <div class="d-timeline__hour" style="top:200px"><span>14:00</span></div>
    <div class="d-meeting d-meeting--focus d-meeting--one" style="top:4px;height:26px"><span class="d-meeting__title">Focus · Trier l'Inbox</span><span class="d-meeting__time">9:05</span></div>
    <div class="d-meeting d-meeting--now d-meeting--one" style="top:42px;height:28px"><span class="d-meeting__title">Point hebdo</span><span class="d-meeting__time">fin 10:45</span></div>
    <div class="d-timeline__now" style="top:64px"><span>10:35</span></div>
    <div class="d-meeting d-meeting--slot" style="top:84px;height:72px"><span class="d-meeting__title">Libre · 2 h</span><span class="d-meeting__time">11:00–13:00 · 2 pomodoros possibles</span></div>
    <div class="d-meeting d-meeting--upcoming d-meeting--one" style="top:202px;height:28px"><span class="d-meeting__title">Revue du devis</span><span class="d-meeting__time">14:00–14:45</span></div>
  </div>
</div>
</body>
</html>
