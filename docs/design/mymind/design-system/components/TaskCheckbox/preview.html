<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>TaskCheckbox</title></head>
<body class="d-preview">
<div class="d-row">
  <button class="d-check" role="checkbox" aria-checked="false" aria-label="Cocher"><svg class="d-ico" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="M2.2 6.4l2.4 2.4 5.2-5.6"/></svg></button>
  <button class="d-check" role="checkbox" aria-checked="false" aria-label="Cocher" style="color:var(--borderControl)"><svg class="d-ico" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="M2.2 6.4l2.4 2.4 5.2-5.6"/></svg></button>
  <button class="d-check" role="checkbox" aria-checked="true" aria-label="Rouvrir"><svg class="d-ico" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="M2.2 6.4l2.4 2.4 5.2-5.6"/></svg></button>
  <button class="d-check" role="checkbox" aria-checked="false" aria-label="Cocher" disabled><svg class="d-ico" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="M2.2 6.4l2.4 2.4 5.2-5.6"/></svg></button>
</div>
<p style="margin:12px 0 0;font:400 12px/16px var(--font-sans);color:var(--textSecondary)">Clique sur une case pour voir le rebond.</p>
<script>
document.querySelectorAll('.d-check:not(:disabled)').forEach(function (b) {
  b.addEventListener('click', function () {
    var on = b.getAttribute('aria-checked') !== 'true';
    b.setAttribute('aria-checked', on ? 'true' : 'false');
    b.style.color = '';
    b.classList.remove('is-popping'); void b.offsetWidth;
    if (on) b.classList.add('is-popping');
  });
});
</script>
</body>
</html>
