<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>StateChip</title></head>
<body class="d-preview">
<div class="d-row">
  <span class="d-chip d-chip--today"><svg class="d-ico" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="6" cy="6" r="2.3" fill="currentColor" stroke="none"/><path d="M6 .9v1.3M6 9.8v1.3M.9 6h1.3M9.8 6h1.3M2.4 2.4l.9.9M8.7 8.7l.9.9M2.4 9.6l.9-.9M8.7 3.3l.9-.9"/></svg>Aujourd'hui</span>

  <span class="d-chip d-chip--blocked"><svg class="d-ico" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="6" r="4.4"/><path d="M2.9 9.1l6.2-6.2"/></svg>Bloquée</span>
  <span class="d-chip d-chip--risk"><svg class="d-ico" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M6 1.4l5 9H1z"/><path d="M6 4.8v2.4" stroke-linecap="round"/><circle cx="6" cy="8.7" r=".5" fill="currentColor" stroke="none"/></svg>En retard</span>
  <span class="d-chip d-chip--past"><svg class="d-ico" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="M2.2 6.4l2.4 2.4 5.2-5.6"/></svg>Fait hier</span>
</div>
</body>
</html>
