<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Card</title></head>
<body class="d-preview">
<div class="d-row" style="align-items:flex-start;gap:20px">
  <div class="d-card" style="width:240px">
    <div class="d-eyebrow">Fait aujourd'hui</div>
    <div class="d-display" style="font-size:23px;line-height:28px;margin-top:4px">3 pomodoros</div>
    <hr class="d-hairline" style="margin:12px 0">
    <div style="font:400 13px/18px var(--font-sans);color:var(--textSecondary)">Carte simple : liseré, sans ombre.</div>
  </div>
  <div class="d-card d-card--lg" style="width:260px">
    <div class="d-eyebrow">Plan du jour</div>
    <div style="font:600 17px/24px var(--font-sans);margin-top:4px">4 tâches, 2 faites</div>
    <div class="d-bar" style="margin-top:12px"><div class="d-bar__fill" style="width:50%"></div></div>
  </div>
</div>
</body>
</html>
