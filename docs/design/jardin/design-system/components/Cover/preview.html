<!-- @dsCard height=288 -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Done</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bgCanvas); color:var(--textPrimary); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; }
  .art svg { display:block; }
  .green { fill:var(--actionPrimary); }
  .sun { fill:var(--sun); }
  .ink { fill:var(--textPrimary); }
  .brique { fill:var(--stateRisk); }
  .seed { fill:var(--onSun); }
  .r-lg { rx:var(--lg); }
  .r-md { rx:var(--md); }
  .r-chip { rx:var(--chip); }
  .petal { fill:var(--onSun); rx:var(--xs); }
  .words { position:absolute; left:var(--s40); bottom:var(--s40); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-weight:600; font-size:120px; line-height:.92; letter-spacing:-0.01em; color:var(--textPrimary); font-variation-settings:'opsz' 144; }
  .tag { margin:var(--s8) 0 0 4px; font-size:14px; line-height:20px; color:var(--textSecondary); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      actionPrimary 176×262 bled off the top (vert profond, l'identité) · sun 160×160 (tournesol, la joie) · textPrimary 128×224 bleeding off the right (encre) · stateRisk 48×24 once (brique, alertes seulement) ≈ 30% of 960×288
  arrangement one tall green slab with satellites, bottoms on one line s40 above the edge, s16 gutters
  pattern     literal motif, the celebration burst of PomodoroDone and TaskRow: eight petals and a seed cut in onSun into the sun block, chosen because joy in Done is the moment a task or a pomodoro is done
  scales      sides in s8 multiples; gutters s16; petals 10×26 at radius xs, 30 from the centre; corners lg (slab, sun), md (ink), chip (signal)
-->
<rect class="green r-lg" x="0" y="-14" width="176" height="262" rx="20"/>
<rect class="brique r-chip" x="192" y="40" width="48" height="24" rx="8"/>
<rect class="sun r-lg" x="192" y="88" width="160" height="160" rx="20"/>
<rect class="ink r-md" x="368" y="24" width="128" height="224" rx="14"/>
<g transform="translate(272 168)">
  <circle class="seed" r="14"/>
  <rect class="petal" x="-5" y="-56" width="10" height="26" rx="5" transform="rotate(0)"/>
  <rect class="petal" x="-5" y="-56" width="10" height="26" rx="5" transform="rotate(45)"/>
  <rect class="petal" x="-5" y="-56" width="10" height="26" rx="5" transform="rotate(90)"/>
  <rect class="petal" x="-5" y="-56" width="10" height="26" rx="5" transform="rotate(135)"/>
  <rect class="petal" x="-5" y="-56" width="10" height="26" rx="5" transform="rotate(180)"/>
  <rect class="petal" x="-5" y="-56" width="10" height="26" rx="5" transform="rotate(225)"/>
  <rect class="petal" x="-5" y="-56" width="10" height="26" rx="5" transform="rotate(270)"/>
  <rect class="petal" x="-5" y="-56" width="10" height="26" rx="5" transform="rotate(315)"/>
</g>
</svg>
</div>
<div class="words">
<h1 class="name">Done</h1>
<p class="tag">Faire, cocher, souffler. Une chose à la fois.</p>
</div>
</div>
</body>
</html>
